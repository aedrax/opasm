[project]
name = "opasm"
version = "1.2.0"
description = "Interactive assembly REPL for multi-architecture emulation"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.11"
dependencies = [
    "unicorn>=2.0.0",
    "capstone>=5.0.0",
    "keystone-engine>=0.9.2",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
opasm = "opasm.repl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "hypothesis>=6.100",
    "mypy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
